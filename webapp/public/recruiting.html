<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b1e14">
<title>Recruiting Directory · Functioning Faith</title>
<meta name="description" content="Highschool and college athletes on Functioning Faith, showcasing real training stats to coaches and scouts.">
<link rel="stylesheet" href="/styles.css?v=recruiting-v1">
<style>
  .recruit-wrap{max-width:760px;margin:0 auto;padding:18px}
  .recruit-filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  .recruit-filters select,.recruit-filters input{flex:1;min-width:140px}
  .recruit-card{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;margin-bottom:10px}
  .recruit-card .rc-avatar{width:52px;height:52px;border-radius:50%;background:var(--parch-1,#e9dcc0);display:grid;place-items:center;font-weight:700;flex-shrink:0}
  .rc-stats{display:flex;gap:14px;margin-top:6px;font-size:.78rem}
  .rc-stats div{color:var(--muted,#7a6c53)}
  .rc-stats b{color:inherit}
  .recruit-empty{text-align:center;padding:30px 10px}
</style>
</head>
<body>
<main class="recruit-wrap">
  <a class="ghost" href="/">← Back to Functioning Faith</a>
  <p class="home-kicker" style="margin-top:14px">RECRUITING DIRECTORY</p>
  <h1 style="margin:2px 0 6px">Find your next athlete</h1>
  <p class="muted">Highschool and college athletes on Functioning Faith, showing real training data pulled straight from their logged workouts — not self-reported.</p>

  <div class="recruit-filters">
    <select id="f-sport"><option value="">All sports</option></select>
    <input id="f-year" type="number" min="2020" max="2035" placeholder="Graduating class">
    <input id="f-q" type="text" placeholder="Name or school">
    <button class="primary" id="f-go">Search</button>
  </div>

  <div id="results" class="muted">Loading…</div>
</main>
<script src="/recruiting.js?v=v2"></script>
</body></html>
