<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Functioning Faith</title>
<meta name="theme-color" content="#2b1e14" />
<meta name="description" content="Functioning Faith — move your body, deepen your faith, and find your people." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Functioning Faith" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%232d2013' stroke-width='5.5' stroke-dasharray='76 94' transform='rotate(96 32 32)'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23d9ab55' stroke-width='5.5' stroke-dasharray='76 94' transform='rotate(-84 32 32)'/%3E%3Cpath d='M39.5 19V52M30 30.5H49' stroke='%23d9ab55' stroke-width='5.5' fill='none'/%3E%3Cpath d='M37 15.5h-3.5a7.5 7.5 0 0 0-7.5 7.5V47M19 30.5H33' stroke='%232d2013' stroke-width='5.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles.css?v=home-explore-v1" />
<!-- Hides the app root at the CSS level, before ANY script runs, so there is
     no flash of the homepage before app-intro.js's overlay covers it -- a
     <style> tag blocks first paint on its own, which is earlier and more
     reliable than any script (even a synchronous one) could manage. app.js
     is not deferred and paints #app almost immediately; app-intro.js IS
     deferred, so without this, the homepage was visible for one paint before
     the overlay landed on top of it.
     Revealed by app-intro.js the moment it takes over (overlay already
     covers the screen by then) or on its early-return paths (already shown
     this session, reduced motion). The inline script below is an
     independent safety net: if app-intro.js fails to load or throws before
     reaching its own reveal, the app must not stay hidden forever. -->
<style>#app{visibility:hidden}</style>
<script src="/fouc-safety.js?v=ff-buildout-19" defer></script>
<!-- The intro's brand mark is inline SVG (zero fetch), but its audio -- a
     trimmed real recording, not a video -- is worth a head start. Tiny file
     (~90KB); nothing else in the intro waits on it. -->
<link rel="preload" as="audio" href="/violin-open-string.ogg?v=v1" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 64 64" role="img" aria-label="Functioning Faith">
          <!-- The ring, as two arcs with a gap top and bottom. Dash lengths are
               fractions of the circumference (2*pi*27 = 169.6). -->
          <g fill="none" stroke-linecap="butt">
            <circle cx="32" cy="32" r="27" stroke="var(--logo-ink)" stroke-width="5.5"
                    stroke-dasharray="76 94" transform="rotate(96 32 32)"/>
            <circle cx="32" cy="32" r="27" stroke="var(--logo-gold)" stroke-width="5.5"
                    stroke-dasharray="76 94" transform="rotate(-84 32 32)"/>
          </g>
          <!-- The cross sits behind the f, so the f's stem reads in front. -->
          <g fill="none" stroke="var(--logo-gold)" stroke-width="5.5" stroke-linecap="butt">
            <path d="M39.5 19 V 52"/>
            <path d="M30 30.5 H 49"/>
          </g>
          <!-- The f: hooked stem plus the shared crossbar. -->
          <g fill="none" stroke="var(--logo-ink)" stroke-width="5.5"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M37 15.5 h-3.5 a7.5 7.5 0 0 0 -7.5 7.5 V 47"/>
            <path d="M19 30.5 H 33"/>
          </g>
        </svg>
      </span>
      <!-- The mark carries the name now. Kept for screen readers and for anyone
           who lands here with CSS disabled. -->
      <span class="brand-word visually-hidden">Functioning Faith</span>
    </div>
    <div id="topbar-right" class="muted" style="font-size:0.75rem;">
      <button id="dm-btn" class="ghost topbar-icon-btn" aria-label="Messages" type="button" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 01-9 8.4 9.6 9.6 0 01-3-.5L4 21l1.6-4.4A8.4 8.4 0 013 11.5 8.4 8.4 0 0112 3a8.4 8.4 0 019 8.5z"/>
        </svg>
        <span id="dm-badge" class="notif-badge" style="display:none">0</span>
      </button>
      <button id="search-btn" class="ghost topbar-icon-btn" aria-label="Search" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
        </svg>
      </button>
      <div class="notif-wrap" id="notif-wrap" style="position:relative;display:none">
        <button id="notif-bell" class="ghost notif-bell" aria-label="Notifications" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
          <span id="notif-badge" class="notif-badge" style="display:none">0</span>
        </button>
      </div>
    </div>
  </header>
  <!-- Notification panel lives OUTSIDE the header on purpose. The header sets a
       light cream `color` for its wood background and creates its own stacking
       context (position:sticky + z-index), so a panel nested inside it inherited
       invisible light-on-light text and could not paint above the tab bar. -->
  <div id="notif-panel" class="card glass notif-panel" style="display:none"></div>
  <!-- GPS acquisition bar. Red while the fix is unusable, green when it is
       ready, then it takes itself away. -->
  <div id="gps-bar" class="gps-bar" hidden><span id="gps-bar-text"></span></div>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="home"><span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/><path d="M12 2.5v3.5M10.4 4.2h3.2"/><path d="M10 19v-4h4v4"/></svg>
    </span>Home</button>
    <button data-tab="workout"><span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="4.5" r="2"/><path d="M8 22l2.6-6.2L7 13l1.2-5 3.8 2 2 3 3.2 1"/><path d="M8.2 8L5 9.2"/></svg>
    </span>Train</button>
    <button data-tab="stats"><span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="5"/><rect x="12" y="8" width="3" height="9"/><rect x="17" y="5" width="3" height="12"/></svg>
    </span>Stats</button>
    <button data-tab="explore"><span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2 5.2-5.2 2 2-5.2 5.2-2z"/><circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg>
    </span>Explore</button>
    <button data-tab="profile"><span class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c0-4.2 3.8-6.2 7.5-6.2s7.5 2 7.5 6.2"/></svg>
    </span>Profile</button>
  </nav>
</div>

<script src="/visual-polish.js?v=ff-buildout-19" defer></script>
</body>
</html>
