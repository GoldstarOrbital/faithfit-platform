name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - "ios/FunctioningFaith/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/FunctioningFaith/**"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: ios/FunctioningFaith
        run: xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        working-directory: ios/FunctioningFaith
        run: |
          set +e
          python3 -c 'import subprocess,sys; log=open("/tmp/functioning-faith-ios-build.log","w"); result=subprocess.run(sys.argv[1:],stdout=log,stderr=subprocess.STDOUT,timeout=900); log.close(); sys.exit(result.returncode)' xcodebuild -project FunctioningFaith.xcodeproj -scheme FunctioningFaith -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          status=$?
          cat /tmp/functioning-faith-ios-build.log
          if [ "$status" -ne 0 ]; then
            echo '--- Swift/Xcode errors ---'
            grep -Ei '(^|: )(error|fatal error):' /tmp/functioning-faith-ios-build.log || true
            exit "$status"
          fi

      - name: Run unit tests
        working-directory: ios/FunctioningFaith
        run: >-
          xcodebuild
          -project FunctioningFaith.xcodeproj
          -scheme FunctioningFaith
          -configuration Debug
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16 Pro'
          CODE_SIGNING_ALLOWED=NO
          test
