name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "webapp/**"
      - ".github/workflows/web-ci.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - name: Check server JavaScript
        run: |
          node --check server.js
          node --check routes/api.js
          node --check lib/account-security.js
          node --check lib/oauth.js
          node --check public/app.js
          node --check public/journey3d.js
          node --check public/journey-live.js
          node --check public/sw.js
          node --check scripts/verify-native-auth.js
          node --check scripts/verify-group-pulse.js
          node --check scripts/verify-public-share.js
          node --check scripts/verify-journey-world.js
          node --check scripts/verify-reel-studio.js
          node --check scripts/verify-athletic-signal.js
          node --check scripts/verify-admin-hq.js
          node --check scripts/verify-workout-kudos.js
          node --check scripts/verify-scripture-practice.js
      - name: Verify native authentication contract
        run: npm run verify:native-auth
      - name: Verify feed ranking and privacy
        run: |
          node scripts/verify-feed-ranking.js
          node scripts/verify-verse-companion-cache.js
      - name: Verify shell deployment freshness
        run: node scripts/verify-shell-cache.js
      - name: Verify hot query paths use indexes
        run: node scripts/verify-query-plans.js
      - name: Verify deletion removes a member's name everywhere
        run: node scripts/verify-deletion-removes-name.js
      # These three assert against the served shell, so a change to how assets
      # are versioned breaks them. All three had rotted while none of them ran.
      - name: Verify offline Scripture
        run: node scripts/verify-offline-scripture.js
      - name: Verify saved Scripture collection
        run: node scripts/verify-scripture-collection.js
      - name: Verify reel tuning privacy
        run: node scripts/verify-reel-tuning.js
      - name: Verify search navigation
        run: node scripts/verify-search-navigation.js
      - name: Verify workout distance validation
        run: node scripts/verify-workout-distance.js
      - name: Verify Reels opens without third-party calls
        run: node scripts/verify-reels-latency.js
      - name: Verify Scripture in Motion stays local-fast
        run: node scripts/verify-scripture-mission-latency.js
      - name: Verify Home Scripture in Motion fast path
        run: node scripts/verify-home-scripture-mission.js
      - name: Verify Bible Answers floating chat shell
        run: node scripts/verify-bible-answers.js
      - name: Verify blocking severs the relationship
        run: node scripts/verify-block-severs-relationship.js
      - name: Verify muted stories stay hidden
        run: node scripts/verify-story-mutes.js
      - name: Verify story circle and teen privacy locks
        run: node scripts/verify-story-privacy.js
      - name: Verify private group pulse contract
        run: npm run verify:group-pulse
      - name: Verify public sharing acquisition contract
        run: npm run verify:public-share
      - name: Verify Journey world contract
        run: npm run verify:journey-world
      - name: Verify Reel studio contract
        run: npm run verify:reel-studio
      - name: Verify athletic signal contract
        run: npm run verify:athletic-signal
      - name: Verify admin headquarters contract
        run: npm run verify:admin-hq
      - name: Verify workout kudos contract
        run: npm run verify:workout-kudos
      - name: Verify Scripture practice contract
        run: npm run verify:scripture-practice
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
