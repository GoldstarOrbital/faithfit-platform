name: FunctioningFaith
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    # Set your Team ID in Xcode or override here before archive.
    DEVELOPMENT_TEAM: ""
targets:
  FunctioningFaith:
    type: application
    platform: iOS
    sources:
      - path: FunctioningFaith
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/FunctioningFaith.entitlements
    resources:
      - path: FunctioningFaith/Resources/PrivacyInfo.xcprivacy
    info:
      path: FunctioningFaith/Resources/Info.plist
      properties:
        # User-facing name stays spaced; PRODUCT_NAME stays stable for paths.
        CFBundleDisplayName: Functioning Faith
        # Production API host. Override per-build by changing this key or
        # setting FFAPIBaseURL in a .xcconfig if you add environment flavors.
        FFAPIBaseURL: https://faithfit-demo-production.up.railway.app
        # Native Apple audience must match the App ID / server APPLE_NATIVE_CLIENT_ID.
        FFAppleClientID: com.functioningfaith.app
    entitlements:
      path: FunctioningFaith/Resources/FunctioningFaith.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app
        PRODUCT_MODULE_NAME: FunctioningFaith
        # Keep the executable/test-host path stable while Info.plist preserves
        # the spaced, user-facing name on the Home Screen.
        PRODUCT_NAME: FunctioningFaith
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        # Codegen / capability reminders (enable on the real App ID in the portal):
        # - Sign in with Apple
        # - HealthKit
        # - Push Notifications (if shipping APNs)
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          # Release must never ship with mock networking (APIClient uses #if DEBUG).
  FunctioningFaithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FunctioningFaithTests
    dependencies:
      - target: FunctioningFaith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app.tests
        PRODUCT_MODULE_NAME: FunctioningFaithTests

schemes:
  FunctioningFaith:
    build:
      targets:
        FunctioningFaith: all
        FunctioningFaithTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FunctioningFaithTests
