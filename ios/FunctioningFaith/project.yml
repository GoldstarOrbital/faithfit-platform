name: FunctioningFaith
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    # Set your Team ID in Xcode or override here before archive.
    DEVELOPMENT_TEAM: ""
targets:
  FunctioningFaith:
    type: application
    platform: iOS
    sources:
      - path: FunctioningFaith
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/FunctioningFaith.entitlements
          - Resources/Assets.xcassets
    resources:
      - path: FunctioningFaith/Resources/PrivacyInfo.xcprivacy
      - path: FunctioningFaith/Resources/Assets.xcassets
      - path: FunctioningFaith/Resources/AppIcon60x60@2x.png
      - path: FunctioningFaith/Resources/AppIcon60x60@3x.png
      - path: FunctioningFaith/Resources/AppIcon76x76@2x.png
      - path: FunctioningFaith/Resources/AppIcon83.5x83.5@2x.png
    entitlements:
      path: FunctioningFaith/Resources/FunctioningFaith.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app
        INFOPLIST_FILE: FunctioningFaith/Resources/Info.plist
        PRODUCT_MODULE_NAME: FunctioningFaith
        PRODUCT_NAME: FunctioningFaith
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  FunctioningFaithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FunctioningFaithTests
    dependencies:
      - target: FunctioningFaith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app.tests
        PRODUCT_MODULE_NAME: FunctioningFaithTests

schemes:
  FunctioningFaith:
    build:
      targets:
        FunctioningFaith: all
        FunctioningFaithTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FunctioningFaithTests
