name: FunctioningFaith
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  FunctioningFaith:
    type: application
    platform: iOS
    sources:
      - path: FunctioningFaith
        excludes:
          - Resources/Info.plist
          - Resources/PrivacyInfo.xcprivacy
          - Resources/FunctioningFaith.entitlements
    resources:
      - path: FunctioningFaith/Resources/PrivacyInfo.xcprivacy
    info:
      path: FunctioningFaith/Resources/Info.plist
    entitlements:
      path: FunctioningFaith/Resources/FunctioningFaith.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app
        PRODUCT_MODULE_NAME: FunctioningFaith
        PRODUCT_NAME: Functioning Faith
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
  FunctioningFaithTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FunctioningFaithTests
    dependencies:
      - target: FunctioningFaith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.functioningfaith.app.tests
        PRODUCT_MODULE_NAME: FunctioningFaithTests

schemes:
  FunctioningFaith:
    build:
      targets:
        FunctioningFaith: all
        FunctioningFaithTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FunctioningFaithTests
