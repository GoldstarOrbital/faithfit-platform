# Example ExternalSecret (requires external-secrets operator) pulling from a real vault -
# never commit actual secret values to this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: functioning-faith-secrets
  namespace: functioning-faith
spec:
  refreshInterval: 1h
  secretStoreRef: { name: functioning-faith-vault-store, kind: ClusterSecretStore }
  target: { name: functioning-faith-secrets }
  data:
    - secretKey: YOUVERSION_API_KEY
      remoteRef: { key: functioning-faith/youversion, property: api_key }
    - secretKey: GLOO_API_KEY
      remoteRef: { key: functioning-faith/gloo, property: api_key }
    - secretKey: APNS_AUTH_KEY
      remoteRef: { key: functioning-faith/apns, property: auth_key }
