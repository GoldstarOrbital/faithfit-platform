workflows:
  ios-testflight:
    name: iOS TestFlight release
    max_build_duration: 45
    instance_type: mac_mini_m2
    # Every main-branch iOS change goes through the signed TestFlight pipeline;
    # no manual archive is used as a substitute for release verification.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    inputs:
      submit_to_testflight:
        description: Upload this signed IPA to TestFlight after a successful build
        type: boolean
        default: true
    integrations:
      app_store_connect: Functioning Faith TestFlight
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.functioningfaith.app
      xcode: latest
      vars:
        IOS_PROJECT_DIR: ios/FunctioningFaith
        XCODE_PROJECT: FunctioningFaith.xcodeproj
        XCODE_SCHEME: FunctioningFaith
        APP_STORE_APPLE_ID: 6804050319
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate the Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          xcodegen generate --spec project.yml
      - name: Set the next App Store build number
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          # Apple may not expose a build number while the preceding upload is
          # still processing. A UTC epoch is monotonic, numeric, and always
          # higher than every previously uploaded build in this app.
          agvtool new-version -all "$(date -u +%s)"
      - name: Apply App Store signing profiles
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          # Bind the fetched App Store profile to this generated project only.
          # Leaving the project implicit can let the helper select a stale or
          # unrelated project when its search path changes.
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Verify HealthKit signing configuration
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -showBuildSettings | tee /tmp/xcodebuild_logs/signing-settings.log
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -showBuildSettings | \
            grep -E 'CODE_SIGN_ENTITLEMENTS = .*FunctioningFaith\.entitlements'
      # Keep Xcode's complete archive output as an artifact. The Codemagic helper
      # only reports its final exit status, which makes signing or plist failures
      # impossible to diagnose from the build page.
      - name: Archive preflight with full diagnostics
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          mkdir -p /tmp/xcodebuild_logs
          set -o pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/ios-archive-preflight/FunctioningFaith.xcarchive" \
            archive 2>&1 | tee /tmp/xcodebuild_logs/archive-preflight.log
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Preserve HealthKit entitlement in exported IPA
        script: |
          set -euo pipefail
          ipa=$(find "$CM_BUILD_DIR/$IOS_PROJECT_DIR/build/ios/ipa" -name '*.ipa' -print -quit)
          test -n "$ipa"
          work=/tmp/functioning-faith-healthkit-resign
          rm -rf "$work"
          mkdir -p "$work"
          unzip -qq "$ipa" -d "$work"
          app="$work/Payload/FunctioningFaith.app"
          # Xcode's export step is currently omitting HealthKit even though
          # the active App Store profile authorizes it. Preserve all existing
          # distribution entitlements, add the authorized key, and re-sign.
          codesign -d --entitlements :- "$app" 2>&1 | sed -n '/<plist /,$p' > "$work/entitlements.plist"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.developer.healthkit bool true' "$work/entitlements.plist" || \
            /usr/libexec/PlistBuddy -c 'Set :com.apple.developer.healthkit true' "$work/entitlements.plist"
          identity=$(security find-identity -v -p codesigning | sed -n 's/.* \([A-F0-9]\{40\}\) \"Apple Distribution:.*/\1/p' | head -n 1)
          test -n "$identity"
          codesign --force --sign "$identity" --entitlements "$work/entitlements.plist" --generate-entitlement-der "$app"
          rm -f "$ipa"
          # The helper plist is only input to codesign; an IPA may contain
          # only Apple-recognized bundle paths at its archive root.
          rm -f "$work/entitlements.plist"
          (cd "$work" && zip -qry "$ipa" .)
      - name: Verify final IPA metadata and icons
        script: |
          set -euo pipefail
          ipa=$(find "$CM_BUILD_DIR/$IOS_PROJECT_DIR/build/ios/ipa" -name '*.ipa' -print -quit)
          test -n "$ipa"
          rm -rf /tmp/functioning-faith-ipa-check
          mkdir -p /tmp/functioning-faith-ipa-check
          unzip -qq "$ipa" -d /tmp/functioning-faith-ipa-check
          app=/tmp/functioning-faith-ipa-check/Payload/FunctioningFaith.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Info.plist"
          # HealthKit must be present in the signed app, not merely in the
          # source entitlements file.
          # codesign writes an `Executable=…` diagnostic before the plist on
          # some Xcode releases. Retain only the XML payload before parsing.
          codesign -d --entitlements :- "$app" 2>&1 | sed -n '/<plist /,$p' > /tmp/functioning-faith-entitlements.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' /tmp/functioning-faith-entitlements.plist | grep -qx true
          test -f "$app/Assets.car"
          find "$app" \( -name 'Assets.car' -o -iname '*appicon*' \) -print | sort
          test -f "$app/AppIcon76x76@2x.png"
    artifacts:
      - ios/FunctioningFaith/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: ${{ inputs.submit_to_testflight }}

  ios-simulator-verify:
    name: iOS simulator verification
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
      vars:
        IOS_PROJECT_DIR: ios/FunctioningFaith
        XCODE_PROJECT: FunctioningFaith.xcodeproj
        XCODE_SCHEME: FunctioningFaith
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate the Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          xcodegen generate --spec project.yml
      - name: Build for the iOS Simulator
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run unit tests
        script: |
          cd "$CM_BUILD_DIR/$IOS_PROJECT_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,OS=26.4.1,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            test
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
